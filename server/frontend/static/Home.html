<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        /* MG Qatar Style Palette */
        :root {
            --mg-red: #db0000;
            --mg-black: #000000;
            --mg-grey: #f4f4f4;
        }

        body {
            font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            margin: 0;
        }

        /* Navbar & Session Links */
        .navbar {
            background-color: var(--mg-black) !important;
            border-bottom: 4px solid var(--mg-red);
            padding: 1rem 2rem;
        }

        .navbar-brand-text {
            color: #fff;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-decoration: none;
        }

        .nav-link {
            color: #fff !important;
            text-transform: uppercase;
            font-size: 0.9rem !important;
            font-weight: 600;
            margin-left: 20px;
            transition: color 0.3s;
        }

        .nav-link:hover, .nav-link.active {
            color: var(--mg-red) !important;
        }

        .homepage_links {
            color: #fff;
            text-decoration: none;
            margin-left: 15px;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            cursor: pointer;
        }

        .homepage_links:hover {
            color: var(--mg-red);
        }

        /* Hero Card Section */
        .hero-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 60px;
        }

        .main-card {
            width: 60%;
            border: none;
            box-shadow: 0 15px 40px rgba(0,0,0,0.1);
            overflow: hidden;
            border-bottom: 6px solid var(--mg-red);
        }

        .card-img-top {
            filter: brightness(80%);
            transition: transform 0.5s ease;
        }

        .main-card:hover .card-img-top {
            transform: scale(1.03);
            filter: brightness(100%);
        }

        .banner-content {
            padding: 40px;
            text-align: center;
            background: #fff;
        }

        .banner-content h5 {
            font-weight: 800;
            text-transform: uppercase;
            font-size: 1.8rem;
            letter-spacing: 1px;
            margin-bottom: 20px;
        }

        /* MG Red Button */
        .btn-mg {
            background-color: var(--mg-red);
            color: white;
            border: none;
            padding: 12px 30px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 0;
            transition: background 0.3s ease;
        }

        .btn-mg:hover {
            background-color: #b30000;
            color: white;
        }
    </style>

    <script>
        const logout = async () => {
            let logout_url = window.location.origin + "/djangoapp/logout";
            
            try {
                const res = await fetch(logout_url, {
                    method: "GET",
                });

                const json = await res.json();
                
                if (json) {
                    let username = sessionStorage.getItem('username');
                    
                    // The alert MUST come before the reload to be visible
                    alert("Logging out " + (username ? username : "user") + "...");
                    
                    sessionStorage.removeItem('username');
                    
                    // Redirect to home and refresh
                    window.location.href = window.location.origin;
                } else {
                    alert("The user could not be logged out.");
                }
            } catch (error) {
                console.error("Logout Error:", error);
                alert("Error connecting to the server.");
            }
        };

        let checkSession = () => {
            let curr_user = sessionStorage.getItem("username");
            let loginContainer = document.getElementById("loginlogout");

            if (curr_user && curr_user !== "") {
                loginContainer.innerHTML = 
                    `<span class="homepage_links" style="color:var(--mg-red)">${curr_user}</span>` +
                    `<a class="homepage_links" onclick="logout()">Logout</a>`;
            } else {
                loginContainer.innerHTML = 
                    `<a class="homepage_links" href="/login">Login</a>` +
                    `<a class="homepage_links" href="/register">Register</a>`;
            }
        }
    </script>
</head>
<body onload="checkSession()">

<nav class="navbar navbar-expand-lg navbar-dark sticky-top">
    <div class="container-fluid">
        <a class="navbar-brand-text" href="/">Apex Motor Group</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarText">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarText">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item"><a class="nav-link active" href="#">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="/about">About Us</a></li>
                <li class="nav-item"><a class="nav-link" href="/contact">Contact Us</a></li>
            </ul>
            <div class="d-flex align-items-center" id="loginlogout">
                </div>
        </div>
    </div>
</nav>

<div class="hero-section">
    <div class="card main-card">
        <img src="static/car_dealership.jpg" class="card-img-top" alt="Luxury Showroom">
        <div class="banner-content">
            <h5>Experience Innovation & Luxury</h5>
            <p class="text-muted">Explore the widest selection of premium vehicles in Qatar.</p>
            <a href="/dealers" class="btn btn-mg">View Dealerships</a>
        </div>
    </div>
</div>

</body>
</html>
